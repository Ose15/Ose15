<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <defs>
    <path id="spark" d="M0,-8 C1,-2 2,-1 8,0 C2,1 1,2 0,8 C-1,2 -2,1 -8,0 C-2,-1 -1,-2 0,-8 Z"/>
  </defs>

  <ellipse cx="120" cy="110" rx="105" ry="80" fill="#EDE9FE" opacity="0.8">
    <animate attributeName="ry" values="80;85;80" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- books -->
  <rect x="62" y="166" width="116" height="12" rx="3" fill="#C4B5FD"/>
  <rect x="70" y="154" width="100" height="12" rx="3" fill="#F9A8D4"/>
  <rect x="78" y="166" width="4" height="12" fill="#FFFFFF" opacity="0.6"/>
  <rect x="86" y="154" width="4" height="12" fill="#FFFFFF" opacity="0.6"/>

  <!-- stem grows -->
  <path d="M120,124 C120,104 114,92 120,64" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="70" stroke-dashoffset="70">
    <animate attributeName="stroke-dashoffset" values="70;0;0;70" keyTimes="0;0.3;0.92;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- leaves -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.35;0.92;1" dur="7s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 118 100;6 118 100;-6 118 100" dur="3s" repeatCount="indefinite"/>
      <path d="M118,100 C104,98 94,88 92,78 C104,78 116,86 118,100 Z" fill="#86EFAC"/>
      <path d="M121,90 C134,88 144,78 146,68 C134,68 123,76 121,90 Z" fill="#4ADE80"/>
    </g>
  </g>

  <!-- flower blooms -->
  <g transform="translate(120,60)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.48;0.92;1" dur="7s" repeatCount="indefinite"/>
    <g fill="#F9A8D4">
      <circle cx="0" cy="-8" r="6"/>
      <circle cx="7.6" cy="-2.5" r="6"/>
      <circle cx="4.7" cy="6.5" r="6"/>
      <circle cx="-4.7" cy="6.5" r="6"/>
      <circle cx="-7.6" cy="-2.5" r="6"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#FCD34D"/>
  </g>

  <!-- pot -->
  <path d="M96,124 L144,124 L138,154 L102,154 Z" fill="#A78BFA"/>
  <rect x="92" y="118" width="56" height="10" rx="4" fill="#8B5CF6"/>
  <circle cx="113" cy="138" r="2" fill="#2E2645"/>
  <circle cx="127" cy="138" r="2" fill="#2E2645"/>
  <path d="M116,143 Q120,147 124,143" fill="none" stroke="#2E2645" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="108" cy="143" r="3" fill="#F9A8D4" opacity="0.8"/>
  <circle cx="132" cy="143" r="3" fill="#F9A8D4" opacity="0.8"/>

  <!-- sparkles -->
  <g fill="#F472B6">
    <use href="#spark" transform="translate(56,64)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#A78BFA">
    <use href="#spark" transform="translate(186,58) scale(0.9)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#FCD34D">
    <use href="#spark" transform="translate(178,128) scale(0.6)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </use>
  </g>
  <g fill="#C4B5FD">
    <use href="#spark" transform="translate(64,132) scale(0.5)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
